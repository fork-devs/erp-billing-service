# =============================================================================
# MANIFIESTO AZURE CONTAINER APPS (ACA) — ERP BILLING SERVICE
# =============================================================================

apiVersion: 2024-03-01
location: eastus2
name: erp-billing-service
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ACA_ENVIRONMENT_NAME}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8086
      transport: auto
      allowInsecure: false
    secrets:
      - name: db-password
        value: ${BILLING_DB_PASSWORD}
      - name: internal-service-key
        value: ${INTERNAL_SERVICE_KEY}
      - name: factos-api-key
        value: ${FACTOS_API_KEY}
      - name: mercadopago-access-token
        value: ${MERCADOPAGO_ACCESS_TOKEN}
  template:
    containers:
      - name: erp-billing-service
        image: ${ACR_NAME}.azurecr.io/erp-billing-service:latest
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: SERVER_PORT
            value: "8086"
          - name: SPRING_PROFILES_ACTIVE
            value: "prod"
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:postgresql://${BILLING_DB_HOST}:${BILLING_DB_PORT}/${BILLING_DB_NAME}?sslmode=require"
          - name: SPRING_DATASOURCE_USERNAME
            value: "${BILLING_DB_USER}"
          - name: SPRING_DATASOURCE_PASSWORD
            secretRef: db-password
          - name: SPRING_FLYWAY_USER
            value: "${BILLING_DB_USER}"
          - name: SPRING_FLYWAY_PASSWORD
            secretRef: db-password
          - name: ERP_APP_DB_PASSWORD
            secretRef: db-password
          - name: JWKS_URL
            value: "http://erp-auth-service:8081/.well-known/jwks.json"
          - name: INTERNAL_SERVICE_KEY
            secretRef: internal-service-key
          - name: FACTOS_BASE_URL
            value: "https://factos-hwjz.onrender.com"
          - name: FACTOS_API_KEY
            secretRef: factos-api-key
          - name: MERCADOPAGO_ACCESS_TOKEN
            secretRef: mercadopago-access-token
        probes:
          - type: Liveness
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 15
          - type: Readiness
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-scaling-rule
          http:
            metadata:
              concurrentRequests: "100"
