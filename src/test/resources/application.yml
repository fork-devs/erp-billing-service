spring:
  profiles:
    active: test
  application:
    name: erp-billing-service-test
  datasource:
    url: jdbc:h2:mem:billing_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

erp:
  auth:
    jwks-url: http://127.0.0.1:1/.well-known/jwks.json
  factos:
    base-url: http://127.0.0.1:1
    api-key: test-mock-key
  outbox:
    relay-enabled: false

resilience4j:
  circuitbreaker:
    instances:
      factos:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
